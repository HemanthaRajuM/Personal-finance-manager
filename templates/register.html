<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | FinancePro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <p class="eyebrow">FINANCEPRO</p>
    <h1 class="h3 mb-2">Create your account</h1>
    <p class="text-secondary mb-4">Start building better financial habits.</p>
    <div id="authMessage" class="alert d-none" role="alert"></div>
    <form id="registerForm" class="vstack gap-3">
      <div><label class="form-label" for="username">Username</label><input id="username" name="username" class="form-control" minlength="3" maxlength="100" autocomplete="username" required></div>
      <div><label class="form-label" for="password">Password</label><input id="password" name="password" class="form-control" type="password" minlength="8" autocomplete="new-password" required></div>
      <div><label class="form-label" for="confirmPassword">Confirm password</label><input id="confirmPassword" class="form-control" type="password" minlength="8" autocomplete="new-password" required></div>
      <button class="btn btn-primary" type="submit">Create account</button>
    </form>
    <p class="text-secondary small mt-4 mb-0">Already registered? <a href="{{ url_for('login_page') }}">Sign in</a></p>
  </main>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
